schema_version: "1.1"
name: action-scene-english-tool
expected_outcome: |
  一次做完。提示詞用英文（Veo），畫幅 16:9，風格鎖定句是水墨國風。
  打鬥段落不在單一鏡頭內拍完整對打，而是拆成出手前、結果、物件特寫、反應等鏡頭，並在風險欄註明。
  沈青崖左臂受傷滲血記錄在造型狀態裡，每一鏡保持一致。
  每一鏡用 beat 指回場次設計的節拍。
  拆成安全鏡頭後打鬥仍看得懂因果；風燈滅後與閃電時的光線跟著變，光和 palette 不矛盾；英文提示詞代入道具後唸得通。
  場次設計寫了走位，打鬥中雙方左右位置一致；開打前交代地理，之後越打越近、越短。
