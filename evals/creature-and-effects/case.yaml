schema_version: "1.1"
name: creature-and-effects
expected_outcome: |
  一場不到 15 鏡的夜戲，一次做完。原文有會說話的燈籠精（沒有嘴）、會現出原形的蛇妖、比人大的妖獸、會一格一格變亮的掌心印記，以及浮在空中的數字。
  設定檔要分類非人角色（kind）；蛇妖的人形與原形各開一個造型變體、各有 look 與 tag；燈籠精標成 mouthless，說話用畫外音並在 motion 寫看得見的說話信號。
  妖獸的大小拿人來比，不只寫神話名稱；變身不在一鏡裡完整拍完；印記的每個階段登記成 states；數字是後製的特效，不進提示詞。
