schema_version: "1.1"
name: live-action-short-drama
expected_outcome: |
  一場不到 20 鏡的豎屏真人短劇，一次做完。使用者還沒決定生成工具。
  bible.json 的 format 是「短劇」、medium 是「真人寫實」、畫幅 9:16；工具欄位留空，沒有 tool_limits、秒數或長度上限，提示詞不為任何工具預先縮短或避開動作與文字。回覆問了要用哪個工具，並說明定了工具之後會再適配一次。
  巴掌那一下照實寫進 motion，risk 寫了工具做不好時的備案。角色設定圖是攝影棚的定妝照；風格鎖定句沒有寫皮膚或臉，膚質寫在角色的 detail；外貌沒有「完美」「精緻」這類詞；近景或特寫用了 lens。
  手機訊息的內容後製加字。前三秒有衝突，場次設計有目的、節拍與高點，最後停在反應上。
