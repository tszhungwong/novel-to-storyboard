schema_version: "1.1"
name: dialogue-scene-missing-appearance
expected_outcome: |
  一次做完（這段不到 15 鏡的規模不需要先停下來確認）。產出設定檔與分鏡檔並執行組合腳本，得到分鏡表與提示詞檔案。
  兩個角色的外貌原文沒寫，要補上具體的暫定值並列為待確認。提示詞用中文（可靈），畫幅 9:16。
  對白拆成說話者與反應者交替；手機訊息的文字不在畫面中生成，改為後製加字。
  每一鏡用 beat 指回場次設計的節拍；風格鎖定句不寫冷暖，便利店夜裡的色彩寫在場景的 light 或 palette。
  回覆詢問圖像工具；提前的鉤子記在 changes、節拍照實填、加字的手機保持靜止；原文菸與咖啡的矛盾有處理並記錄。
  場次設計寫了走位，兩人左右位置一致；手機訊息的揭示有反應鏡頭與訊息鏡頭。
  訊息內容在原本的節拍裡有一鏡交代，不只在可刪的鉤子裡；手機、咖啡、菸的位置前後接得上。
  有台詞的角色都有聲線；交付的製作順序包含用 animatic 與 srt 排動態分鏡這一步。
