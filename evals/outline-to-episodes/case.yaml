schema_version: "1.1"
name: outline-to-episodes
expected_outcome: |
  輸入是一份 8 集、每集 60 到 90 秒的漫劇大綱，沒有台詞。應該先排分集表並停下來確認，不寫分集劇本、不拆分鏡。
  分集表照大綱的結構：第一幕 5 集、第二幕 3 集；每一集都有鉤子、爽點或核心事件、卡點與預估秒數，秒數在 60 到 90 之內。
  單集長度寫進 project.episode_length，用腳本跑出 series.md。大綱沒有指定付費卡點，要問使用者，不自己決定。
  分集表與設定檔不矛盾；第一集只交代一條新規則；對白多時提出聲音方案的選擇。
  每一集最多一條新規則；卡點寫成觀眾的問題；劇情道具都有登記。
  有台詞的主要角色在建設定檔時就定好聲線。
